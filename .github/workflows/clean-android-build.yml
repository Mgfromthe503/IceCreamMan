name: Clean Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.config.ts'
      - 'config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eas.json'
      - 'scripts/release-preflight.mjs'
      - '.github/workflows/clean-android-build.yml'
      - 'src/**'
      - 'app/**'
      - 'assets/**'

permissions:
  contents: write

env:
  EXPO_NO_DOCTOR: '1'

jobs:
  validate:
    name: Ten-point release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run ten release checks
        run: node scripts/release-preflight.mjs

      - name: EAS authentication check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest whoami

      - name: EAS account/project visibility check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest project:info --non-interactive

  build:
    name: Create production Android AAB with Expo EAS
    needs: validate
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize or link the new EAS project
        run: npx --yes eas-cli@latest init --non-interactive

      - name: Verify the EAS project selected by Expo
        run: npx --yes eas-cli@latest project:info --non-interactive

      - name: Ensure Android EAS build configuration
        run: npx --yes eas-cli@latest build:configure --platform android --non-interactive

      - name: Create production Android App Bundle
        run: npx --yes eas-cli@latest build --platform android --profile production --non-interactive --wait

      - name: Release completion marker
        run: |
          echo '============================================='
          echo 'CLEAN ICE CREAM MAN ANDROID BUILD COMPLETE'
          echo '============================================='
          echo 'The production AAB completed through Expo/EAS.'
          echo 'The EAS build URL and artifact are in the preceding output.'
