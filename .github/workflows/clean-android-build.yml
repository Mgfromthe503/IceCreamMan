name: Clean Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.config.ts'
      - 'config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eas.json'
      - 'scripts/release-preflight.mjs'
      - '.github/workflows/clean-android-build.yml'
      - 'src/**'
      - 'app/**'
      - 'assets/**'

permissions:
  contents: write

env:
  EXPO_NO_DOCTOR: '1'
  PNPM_VERSION: '9.12.0'

jobs:
  validate:
    name: Release preflight and EAS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Normalize lockfile metadata
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run release checks
        run: node scripts/release-preflight.mjs

      - name: EAS authentication check
        env:
          EXPO_TOKEN: ${{ secrets.EXPOTOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest whoami

      - name: EAS account/project visibility check
        env:
          EXPO_TOKEN: ${{ secrets.EXPOTOKEN }}
        run: npx --yes eas-cli@latest project:info --non-interactive

  build:
    name: Create production Android AAB with Expo EAS
    needs: validate
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPOTOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Normalize lockfile metadata
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify EAS project
        run: npx --yes eas-cli@latest project:info --non-interactive

      - name: Ensure Android EAS build configuration
        run: npx --yes eas-cli@latest build:configure --platform android --non-interactive

      - name: Create production Android App Bundle
        run: npx --yes eas-cli@latest build --platform android --profile production --non-interactive --wait

      - name: Release completion marker
        run: |
          echo 'CLEAN ICE CREAM MAN ANDROID BUILD COMPLETE'
          echo 'Production AAB completed through Expo/EAS.'
