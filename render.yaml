# Deploy the Express + tRPC API on Render — with a FREE PostgreSQL database
# https://render.com/docs/blueprint-spec
#
# How to deploy:
#   1. Go to https://dashboard.render.com/
#   2. New → Blueprint → connect your GitHub repo
#   3. Render will auto-detect this file and create both the database AND the API service
#   4. Fill in the secret values marked "sync: false" in the Render dashboard
#      (Environment tab of the ice-cream-man-api service)
#
# The DATABASE_URL is wired automatically from the Render Postgres database below —
# you do NOT need to copy/paste it manually.
#
# After first deploy, run migrations once from the Render shell:
#   pnpm db:push
#
# Then set EXPO_PUBLIC_API_BASE_URL in your EAS environment to the Render service URL
# (e.g. https://ice-cream-man-api.onrender.com) so the mobile app can reach the backend.

databases:
  - name: ice-cream-man-db
    databaseName: icecreamman
    user: icecreamman
    plan: free

services:
  - type: web
    name: ice-cream-man-api
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@9.12.0 && pnpm install --no-frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ── Runtime ─────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # ── Database ──────────────────────────────────────────────────────────
      # Automatically wired from the Render Postgres database above
      - key: DATABASE_URL
        fromDatabase:
          name: ice-cream-man-db
          property: connectionString

      # ── Auth / Session ───────────────────────────────────────────────────
      # A long random secret used to sign session JWTs and cookies
      # Generate one with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false   # enter this in the Render dashboard

      # ── OAuth (Forge / built-in auth portal) ─────────────────────────────
      # These come from your Expo/Forge project settings
      - key: APP_ID
        sync: false   # your Expo APP_ID (same as EXPO_PUBLIC_APP_ID)
      - key: OAUTH_SERVER_URL
        sync: false   # e.g. https://auth.expo.io  (same host as EXPO_PUBLIC_OAUTH_SERVER_URL)
      - key: OWNER_OPEN_ID
        sync: false   # your Expo owner open-id (same as EXPO_PUBLIC_OWNER_OPEN_ID)

      # ── Internal Forge API (optional — only needed if using built-in features) ──
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
